<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pagina niet gevonden | ezwebsite</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --text: #0f172a;
        --muted: #475569;
        --border: rgba(15, 23, 42, 0.08);
        --accent-start: #2563eb;
        --accent-end: #7c3aed;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(
            circle at top,
            rgba(124, 58, 237, 0.16),
            transparent 30%
          ),
          radial-gradient(
            circle at bottom right,
            rgba(37, 99, 235, 0.18),
            transparent 32%
          ),
          var(--bg);
        color: var(--text);
        font-family: "Manrope", Arial, sans-serif;
      }

      main {
        width: min(100%, 720px);
        padding: 48px 32px;
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid var(--border);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
        text-align: center;
        backdrop-filter: blur(12px);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.05);
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 20px 0 16px;
        font-family: "Oswald", Arial, sans-serif;
        font-size: clamp(3rem, 11vw, 6rem);
        line-height: 0.9;
        text-transform: uppercase;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0 auto;
        max-width: 44ch;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 28px;
        padding: 14px 24px;
        border-radius: 999px;
        background: linear-gradient(
          135deg,
          var(--accent-start),
          var(--accent-end)
        );
        color: #fff;
        text-decoration: none;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        box-shadow: 0 16px 40px rgba(124, 58, 237, 0.28);
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&family=Oswald:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <span class="eyebrow">404 · Niet gevonden</span>
      <h1>Oeps.</h1>
      <p>
        Deze pagina bestaat niet of is verplaatst. Voor de geldige routes van de
        site laat ik Netlify voortaan netjes doorsturen naar de app, dus deze
        pagina zou je alleen nog op échte missers moeten zien.
      </p>
      <a href="/">Terug naar ezwebsite</a>
    </main>
  </body>
</html>
